name: optimalapi

# Shared connection string for the containers below. Inside the compose network the database host is "db".
# Gss Encryption Mode=Disable: skip the Kerberos probe; the slim .NET image has no Kerberos library and would log a spurious error.
x-db-connection: &db-connection
  ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB:-optimalapi};Username=${POSTGRES_USER:-app};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env};Gss Encryption Mode=Disable

services:
  db:
    image: postgres:17-alpine
    container_name: optimalapi-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-optimalapi}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Runs once: applies pending EF Core migrations, then exits.
  # Migrations run here, not on app startup, so several API instances never race to migrate.
  migrate:
    build:
      context: .
      target: migrator
    image: optimalapi-migrator:local
    container_name: optimalapi-migrate
    environment:
      <<: *db-connection
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: runtime
    image: optimalapi-api:local
    container_name: optimalapi-api
    restart: unless-stopped
    environment:
      <<: *db-connection
      ASPNETCORE_ENVIRONMENT: Development
      # The health dashboard (/health-ui) polls the app itself; inside the container that's localhost:8080.
      HealthChecksUI__EndpointUrl: http://localhost:8080/health
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
